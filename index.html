<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oficina de Foguetes</title>
  <meta name="description" content="Monte seu foguete, escolha o motor e lance! Um simulador de foguetes para crianças.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body class="modo-explorador">
  <header class="topo">
    <div class="marca">
      <span class="marca-icone">🚀</span>
      <div>
        <h1>Oficina de Foguetes</h1>
        <p>Monte, teste e lance o seu foguete!</p>
      </div>
    </div>
    <div class="modo" role="group" aria-label="Modo">
      <button type="button" data-modo="explorador" aria-pressed="true">🧭 Explorador</button>
      <button type="button" data-modo="engenheiro" aria-pressed="false">🛠️ Engenheiro</button>
    </div>
  </header>

  <main class="oficina">
    <aside class="pecas" id="pecas" aria-label="Peças do foguete"></aside>

    <section class="bancada" aria-label="Seu foguete">
      <div class="bancada-topo">
        <label class="nome-foguete">
          <span>Nome do foguete</span>
          <input id="nome" type="text" maxlength="24" autocomplete="off">
        </label>
        <div class="cores" id="cores" role="group" aria-label="Cor do foguete"></div>
      </div>

      <div class="desenho-caixa">
        <canvas id="desenho" aria-label="Desenho do foguete"></canvas>
        <div class="legenda">
          <span><i class="sim-cg"></i> Ponto de equilíbrio <small class="eng">(CG)</small></span>
          <span><i class="sim-cp"></i> Ponto onde o vento empurra <small class="eng">(CP)</small></span>
        </div>
      </div>

      <div class="estab-explica" id="estabExplica"></div>

      <div class="stats" id="stats"></div>

      <div class="acao">
        <button type="button" id="lancar" class="btn-lancar">🚀 LANÇAR!</button>
      </div>
    </section>

    <aside class="lado">
      <section class="cartao">
        <h2>🏆 Missões <span class="contador" id="contMissoes"></span></h2>
        <ul class="missoes" id="missoes"></ul>
      </section>
      <section class="cartao">
        <h2>📋 Meus lançamentos</h2>
        <ul class="historico" id="historico"></ul>
        <button type="button" class="link-btn" id="recomecar">Recomeçar do zero</button>
      </section>
    </aside>
  </main>

  <div class="voo" id="voo" hidden>
    <canvas id="ceu"></canvas>
    <div class="hud">
      <div><span>Altura</span><strong id="hudAlt">0 m</strong></div>
      <div><span>Velocidade</span><strong id="hudVel">0 km/h</strong></div>
      <div><span>Tempo</span><strong id="hudT">0,0 s</strong></div>
    </div>
    <div class="fase-texto" id="faseTexto" aria-live="polite"></div>
    <div class="contagem" id="contagem" aria-live="assertive"></div>
    <div class="controles-voo">
      <span class="acelerado" id="acelerado" hidden>🪂 descida acelerada</span>
      <button type="button" id="btnVel" title="Mudar a velocidade">⏩ 1×</button>
      <button type="button" id="btnPular" title="Pular para o fim">⏭ Pular</button>
      <button type="button" id="btnSair" title="Voltar para a oficina">✕ Voltar</button>
    </div>
    <div class="resultado" id="resultado" hidden></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/flight.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
